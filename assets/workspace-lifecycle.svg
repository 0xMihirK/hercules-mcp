<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Explicit runtime and workspace lifecycle</title>
  <desc id="desc">A cold MCP connection is stopped. An explicit start creates or reattaches one owned Kali container. Stop removes or preserves the container and keeps its host workspace. A new session starts with a different stopped workspace; previous evidence remains inspectable.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#252a2e" opacity=".5"/></pattern><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#ff6a2b" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="390" fill="#0b0d11"/><rect width="1200" height="390" fill="url(#grid)"/><path d="M24 22H1176" stroke="#ff6a2b" stroke-width="3"/>
  <text x="32" y="65" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#f3f0e9">SESSION / WORKSPACE</text>
  <g font-family="Arial,sans-serif"><g transform="translate(32 111)"><rect width="334" height="142" fill="#15191e" stroke="#484d53"/><text x="20" y="39" fill="#ffb48a" font-size="15" font-weight="700">MCP CONNECTS</text><text x="20" y="77" fill="#f3f0e9" font-size="26" font-weight="700">Stopped</text><text x="20" y="112" fill="#b5b5b0" font-size="17">Workspace A · no container</text></g><g transform="translate(434 111)"><rect width="334" height="142" fill="#1d1b19" stroke="#ff6a2b"/><text x="20" y="39" fill="#ffb48a" font-size="15" font-weight="700">SYSTEM_START_CONTAINER</text><text x="20" y="77" fill="#f3f0e9" font-size="26" font-weight="700">Running</text><text x="20" y="112" fill="#b5b5b0" font-size="17">Owned Kali · workspace A</text></g><g transform="translate(836 111)"><rect width="332" height="142" fill="#15191e" stroke="#484d53"/><text x="20" y="39" fill="#ffb48a" font-size="15" font-weight="700">SYSTEM_STOP_CONTAINER</text><text x="20" y="77" fill="#f3f0e9" font-size="26" font-weight="700">Stopped</text><text x="20" y="112" fill="#b5b5b0" font-size="17">Workspace A retained</text></g></g>
  <path d="M371 182H427M773 182H829" stroke="#ff6a2b" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M1001 263V309H202" stroke="#ff6a2b" stroke-dasharray="7 7" fill="none" stroke-width="2" marker-end="url(#tip)"/>
  <text x="601" y="299" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#ffb48a">START AGAIN → SAME WORKSPACE A</text>
  <text x="32" y="357" font-family="Consolas,monospace" font-size="16" fill="#b5b5b0">NEW SESSION → FRESH STOPPED WORKSPACE B · A REMAINS INSPECTABLE</text>
</svg>
