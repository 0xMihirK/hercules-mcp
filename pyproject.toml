[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hercules-mcp"
version = "0.1.0"
description = "Offensive Security MCP Server for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anyio>=4.5,<5",
    "fastmcp>=4.1.3,<5",
    "mcp>=2.3,<3",
    "docker>=7.1,<8",
    # No fixed upstream release exists for GHSA-qpc3-8vqg-8g6w. Hercules does
    # not call the affected run_module_with_output API and rejects CR/LF in all
    # option keys/values before RPC dispatch.
    "pymetasploit3==1.0.6",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28.1,<1",
    "defusedxml>=0.7.1,<1",
    # Round-trip client configuration without discarding comments or settings.
    "tomlkit>=0.13,<1",
    "ruamel.yaml>=0.18,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
hercules = "hercules.main:main"
hercules-workspace = "hercules.workspace_cli:main"
hercules-setup = "hercules.setup_cli:main"

[tool.hatch.build]
# Tests and CI metadata are not included in published packages.
exclude = [
    "tests",
    "tests/**",
    ".github",
    ".github/**",
    "artifacts",
    "artifacts/**",
    "workspace",
    "workspace/**",
    "wordlists",
    "wordlists/**",
    "resources_cache",
    "resources_cache/**",
    ".env",
]

[tool.hatch.build.targets.wheel]
packages = ["hercules"]

[tool.hatch.build.targets.wheel.force-include]
"skills/hercules-mcp" = "hercules/_bundled_skill/hercules-mcp"
"skills/hercules-nmap-nse" = "hercules/_bundled_skill/hercules-nmap-nse"
"skills/hercules-nuclei" = "hercules/_bundled_skill/hercules-nuclei"
"install.md" = "hercules/_bundled_install.md"
".codex-plugin" = "hercules/_bundled_plugin/.codex-plugin"
".claude-plugin" = "hercules/_bundled_plugin/.claude-plugin"
".cursor-plugin" = "hercules/_bundled_plugin/.cursor-plugin"
".mcp.json" = "hercules/_bundled_plugin/.mcp.json"
"mcp.json" = "hercules/_bundled_plugin/mcp.json"
"hercules-mcp.json" = "hercules/_bundled_plugin/hercules-mcp.json"

[tool.hatch.build.targets.sdist.force-include]
"skills/hercules-mcp" = "skills/hercules-mcp"
"skills/hercules-nmap-nse" = "skills/hercules-nmap-nse"
"skills/hercules-nuclei" = "skills/hercules-nuclei"
"install.md" = "install.md"
".codex-plugin" = ".codex-plugin"
".claude-plugin" = ".claude-plugin"
".cursor-plugin" = ".cursor-plugin"
".mcp.json" = ".mcp.json"
"mcp.json" = "mcp.json"
"hercules-mcp.json" = "hercules-mcp.json"

[tool.ruff.lint]
# MCP, Docker, RPC, and setup-information entrypoints normalize heterogeneous
# third-party failures, while cleanup paths are best-effort. Those boundaries
# must catch Exception without swallowing BaseException; all other Ruff rules
# remain enabled.
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
