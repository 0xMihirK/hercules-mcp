id: hercules-lab-debug
info:
  name: Disposable Atlas debug endpoint
  author: hercules-showcase
  severity: info
http:
  - method: GET
    path:
      - '{{BaseURL}}/debug'
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ['"debug": true', 'disposable']
        condition: and
